# Jaeger all-in-one: receives OTLP traces and serves the UI.
# UI: http://localhost:16686
# OTLP HTTP: localhost:4318  |  OTLP gRPC: localhost:4317
services:
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: otel-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      # Allow the browser (via Vite proxy) to post OTLP without CORS pain in local demos.
      - COLLECTOR_OTLP_ENABLED=true
